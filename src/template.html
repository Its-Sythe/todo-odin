<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do App</title>
    </head>
    <body>
        <section class="sidebar">
            <h1>時 Toki</h1>
            <div id="display-task">
                <button id="all-tasks">My Tasks</button>
            </div>
            <h1>My Projects</h1>
            <div id="display-project">
                <button id="add-project">Add Project</button>
            </div>
            <div class="taskModal">
                <form action="#" method="post" id="taskForm" name="taskForm">
                    <label for="taskTitle"></label>
                    <input type="text" id="taskTitle" placeholder="Title">

                    <label for="taskDesc"></label>
                    <input type="text" id="taskDesc" placeholder="Description">

                    <label for="taskDue"></label>
                    <input type="date" id="taskDue" placeholder="2025-02-10">

                    <fieldset>
                        <legend>Priority</legend>
                        <label for="highPriority">High</label>
                        <input type="radio" id="highPriority" name="priority">
                        <label for="midPriority">Medium</label>
                        <input type="radio" id="midPriority" name="priority">
                        <label for="lowPriority">Low</label>
                        <input type="radio" id="lowPriority" name="priority">
                    </fieldset>

                    <button id="submitTask">Add Task</button>
                </form>
            </div>
        </section>
        <section class="content">
            
        </section>

        
    </body>
</html>
