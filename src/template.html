<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do App</title>
    </head>
    <body>
        <section class="sidebar"></section>
        <section class="content"></section>


        <div class="taskModal">
            <form action="#" method="post" id="taskForm" name="taskForm">
                <h1>Add A New Task</h1>
                <label for="taskName"></label>
                <input type="text" id="taskName" placeholder="Title">
                <label for="taskDesc"></label>
                <input type="text" id="taskDesc" placeholder="Description">
                <label for="taskDue"></label>
                <input type="date" id="taskDue">
                <fieldset id="radioBtn">
                    <legend>Task Priority</legend>
                    <label for="high">
                        Highest<input type="radio" name="priority" id="high">
                    </label>
                    <label for="medium">
                        Medium<input type="radio" name="priority" id="medium">
                    </label>
                    <label for="lowest">
                        Lowest<input type="radio" name="priority" id="lowest" checked>
                    </label>    
                </fieldset>
                <button id="submitTask">Add Task</button>
            </form>
        </div>
        <div class="projectModal">
            <form action="#" method="post" id="projectForm" name="projectForm">
                <p>Add A New Project</p>
                <label for="projectName"></label>
                <input type="text" id="projectName" placeholder="Project">
                <button id="submitProject">Add Project</button>
            </form>
        </div>
    </body>
</html>
